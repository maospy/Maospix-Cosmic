LABEL arch
TEXT HELP
Boot the MAOSPIX-COSMIC live on BIOS.
It allows you to try the live session or perform system maintenance.
ENDTEXT
MENU LABEL MAOSPIX-COSMIC live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the MAOSPIX-COSMIC live on BIOS with speakup screen reader.
It allows you to try the live session or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL MAOSPIX-COSMIC live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
