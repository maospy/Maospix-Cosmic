# MAOSPIX-COSMIC — Calamares
# Base: v1 (prueba 13, instalación física validada) + correcciones de maospix-kde.
---
modules-search: [ local ]

instances:
  - id: resolve-unpackfs
    module: shellprocess
    config: resolve-unpackfs.conf
  - id: cleanup
    module: shellprocess
    config: cleanup.conf
  - id: prepare-kernel
    module: shellprocess
    config: prepare-kernel.conf
  - id: postboot
    module: shellprocess
    config: postboot.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@resolve-unpackfs
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - shellprocess@cleanup
      - packages
      - shellprocess@prepare-kernel
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - shellprocess@postboot
      - umount
  - show:
      - finished

branding: maospix-cosmic
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
