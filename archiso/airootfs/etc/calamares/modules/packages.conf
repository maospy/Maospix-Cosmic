---
# Sin red: solo quita paquetes exclusivos de la live (offline).
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false
pacman:
  num_retries: 0
  disable_download_timeout: false
  needed_only: false
operations:
  - try_remove:
      - calamares
      - ckbcomp
      - mkinitcpio-archiso
      - mkinitcpio-nfs-utils
      - arch-install-scripts
      - archinstall
      - cloud-init
      - darkhttpd
      - clonezilla
      - livecd-sounds
      - syslinux
      - memtest86+
      - memtest86+-efi
      - edk2-shell
