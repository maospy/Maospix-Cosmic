---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "cosmic-greeter.service"
    action: "enable"
    mandatory: true
  - name: "bluetooth.service"
    action: "enable"
  - name: "systemd-timesyncd.service"
    action: "enable"
  - name: "docker.socket"
    action: "enable"
  - name: "fstrim.timer"
    action: "enable"
  - name: "systemd-networkd.service"
    action: "disable"
  - name: "systemd-networkd.socket"
    action: "disable"
  - name: "systemd-networkd-wait-online.service"
    action: "disable"
  - name: "iwd.service"
    action: "disable"
  - name: "sshd.service"
    action: "disable"
  - name: "cloud-init.target"
    action: "disable"
  - name: "choose-mirror.service"
    action: "disable"
  - name: "pacman-init.service"
    action: "disable"
  - name: "livecd-talk.service"
    action: "disable"
  - name: "livecd-alsa-unmuter.service"
    action: "disable"
  - name: "vboxservice.service"
    action: "disable"
  - name: "vmtoolsd.service"
    action: "disable"
  - name: "vmware-vmblock-fuse.service"
    action: "disable"
  - name: "hv_fcopy_daemon.service"
    action: "disable"
  - name: "hv_kvp_daemon.service"
    action: "disable"
  - name: "hv_vss_daemon.service"
    action: "disable"
