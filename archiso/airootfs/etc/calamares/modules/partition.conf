---
# ESP en /boot/efi y /boot aparte en ext4 (BIOS y UEFI): GRUB siempre lee el
# kernel desde ext4. En maospix-kde, GRUB falló leyendo el kernel dentro de
# Btrfs ("premature end of file").
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
  - name: "root"
    # "unknown" = usa el sistema de archivos que elija el usuario (btrfs por
    # defecto). Sin esta clave Calamares la deja SIN FORMATO (Prueba 5).
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
    minSize: 15GiB
userSwapChoices: [ none, small, suspend, file ]
initialPartitioningChoice: none
initialSwapChoice: file
luksGeneration: luks1
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
essentialMounts: [ "live-*", "control", "ventoy" ]
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
lvm:
  enable: true
