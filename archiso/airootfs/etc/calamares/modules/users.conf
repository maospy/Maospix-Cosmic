---
defaultGroups:
  - users
  - lp
  - video
  - network
  - storage
  - wheel
  - audio
  - input
  - optical
  - scanner
  - rfkill
  - docker
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
displayAutologin: false
doAutologin: false
passwordRequirements:
  minLength: 4
  maxLength: 128
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, liveuser, cosmic-greeter ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "maospix-${login}"
  forbidden_names: [ localhost, archiso ]
allowActiveDirectory: false
